openapi: 3.0.3
info:
  title: Lugx Gaming - Order Service API
  description: FastAPI microservice for user management and order processing
  version: 1.0.0
  contact:
    name: Lugx Gaming Team
    email: team@lugxgaming.com

servers:
  - url: http://localhost:8002/api/v1
    description: Local development
  - url: https://order-service.lugxgaming.com/api/v1
    description: Production

paths:
  /auth/register:
    post:
      summary: Register new user account
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        '400':
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: User login authentication
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid login data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Refresh authentication token
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: User logout
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully logged out"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      summary: Get current user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{user_id}:
    get:
      summary: Get user profile by ID
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Unauthorized
        '404':
          description: User not found

    put:
      summary: Update user profile
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid update data
        '401':
          description: Unauthorized
        '403':
          description: Cannot update other user's profile
        '404':
          description: User not found

  /cart:
    get:
      summary: Get user's shopping cart
      tags:
        - Shopping Cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Shopping cart retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Clear entire shopping cart
      tags:
        - Shopping Cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cart cleared successfully"
        '401':
          description: Unauthorized

  /cart/add:
    post:
      summary: Add item to shopping cart
      tags:
        - Shopping Cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemAdd'
      responses:
        '201':
          description: Item added to cart successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          description: Invalid cart item data
        '401':
          description: Unauthorized
        '404':
          description: Game not found
        '409':
          description: Game already in cart

  /cart/{item_id}:
    put:
      summary: Update cart item quantity
      tags:
        - Shopping Cart
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        '200':
          description: Cart item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          description: Invalid quantity
        '401':
          description: Unauthorized
        '404':
          description: Cart item not found

    delete:
      summary: Remove item from cart
      tags:
        - Shopping Cart
      security:
        - bearerAuth: []
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Item removed from cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Item removed from cart"
        '401':
          description: Unauthorized
        '404':
          description: Cart item not found

  /orders:
    get:
      summary: Get user's order history
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
      responses:
        '200':
          description: Order history retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized

    post:
      summary: Create new order from cart
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order data or empty cart
        '401':
          description: Unauthorized
        '409':
          description: Inventory insufficient for some items

  /orders/{order_id}:
    get:
      summary: Get order details
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: Unauthorized
        '403':
          description: Cannot view other user's order
        '404':
          description: Order not found

    put:
      summary: Update order status (Admin only)
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, processing, shipped, delivered, cancelled]
                tracking_number:
                  type: string
                  nullable: true
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid status update
        '401':
          description: Unauthorized
        '403':
          description: Admin access required
        '404':
          description: Order not found

  /orders/{order_id}/cancel:
    post:
      summary: Cancel order (if not yet shipped)
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Order cannot be cancelled
        '401':
          description: Unauthorized
        '403':
          description: Cannot cancel other user's order
        '404':
          description: Order not found

  /payment/methods:
    get:
      summary: Get available payment methods
      tags:
        - Payment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment methods retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
        '401':
          description: Unauthorized

  /payment/process:
    post:
      summary: Process payment for order
      tags:
        - Payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid payment data
        '401':
          description: Unauthorized
        '402':
          description: Payment failed
        '404':
          description: Order not found

  /addresses:
    get:
      summary: Get user's saved addresses
      tags:
        - Addresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Addresses retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          description: Unauthorized

    post:
      summary: Add new address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreate'
      responses:
        '201':
          description: Address created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Invalid address data
        '401':
          description: Unauthorized

  /addresses/{address_id}:
    put:
      summary: Update address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: address_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpdate'
      responses:
        '200':
          description: Address updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Invalid address data
        '401':
          description: Unauthorized
        '404':
          description: Address not found

    delete:
      summary: Delete address
      tags:
        - Addresses
      security:
        - bearerAuth: []
      parameters:
        - name: address_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Address deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Address not found

  /newsletter/subscribe:
    post:
      summary: Subscribe to newsletter
      tags:
        - Newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Subscription successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully subscribed to newsletter"
        '400':
          description: Invalid email address
        '409':
          description: Email already subscribed

  /newsletter/unsubscribe:
    post:
      summary: Unsubscribe from newsletter
      tags:
        - Newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Unsubscription successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Successfully unsubscribed from newsletter"
        '400':
          description: Invalid email address
        '404':
          description: Email not found in subscription list

  /admin/users:
    get:
      summary: Get all users (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [user, admin]
      responses:
        '200':
          description: Users list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '403':
          description: Admin access required

  /admin/orders:
    get:
      summary: Get all orders (Admin only)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, shipped, delivered, cancelled]
        - name: user_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Orders list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Unauthorized
        '403':
          description: Admin access required

  /health:
    get:
      summary: Health check endpoint
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  database:
                    type: string
                    example: "connected"
                  redis:
                    type: string
                    example: "connected"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        username:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        is_active:
          type: boolean
        created_at:
          type: string
          format: datetime
        updated_at:
          type: string
          format: datetime

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            phone:
              type: string
              nullable: true
            date_of_birth:
              type: string
              format: date
              nullable: true
            total_orders:
              type: integer
            total_spent:
              type: number
              format: decimal

    UserRegister:
      type: object
      required:
        - email
        - username
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 128
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true

    Cart:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total_items:
          type: integer
        total_price:
          type: number
          format: decimal
        created_at:
          type: string
          format: datetime
        updated_at:
          type: string
          format: datetime

    CartItem:
      type: object
      properties:
        id:
          type: integer
        cart_id:
          type: integer
        game_id:
          type: integer
        game_name:
          type: string
        game_price:
          type: number
          format: decimal
        game_discount_price:
          type: number
          format: decimal
          nullable: true
        quantity:
          type: integer
        subtotal:
          type: number
          format: decimal
        created_at:
          type: string
          format: datetime
        updated_at:
          type: string
          format: datetime

    CartItemAdd:
      type: object
      required:
        - game_id
        - quantity
      properties:
        game_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          default: 1

    Order:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        order_number:
          type: string
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
        total_amount:
          type: number
          format: decimal
        shipping_address:
          $ref: '#/components/schemas/Address'
        payment_method:
          type: string
        payment_status:
          type: string
          enum: [pending, completed, failed, refunded]
        tracking_number:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: datetime
        updated_at:
          type: string
          format: datetime

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            payment_details:
              $ref: '#/components/schemas/PaymentDetails'

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        order_id:
          type: integer
        game_id:
          type: integer
        game_name:
          type: string
        game_price:
          type: number
          format: decimal
        discount_price:
          type: number
          format: decimal
          nullable: true
        quantity:
          type: integer
        subtotal:
          type: number
          format: decimal

    OrderCreate:
      type: object
      required:
        - shipping_address_id
        - payment_method
      properties:
        shipping_address_id:
          type: integer
        payment_method:
          type: string
          enum: [credit_card, paypal, stripe]
        payment_details:
          type: object
          properties:
            card_number:
              type: string
              nullable: true
            card_holder:
              type: string
              nullable: true
            expiry_month:
              type: integer
              nullable: true
            expiry_year:
              type: integer
              nullable: true
            cvv:
              type: string
              nullable: true
            paypal_email:
              type: string
              nullable: true
        notes:
          type: string
          nullable: true

    Address:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
          enum: [home, work, other]
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
          nullable: true
        address_line_1:
          type: string
        address_line_2:
          type: string
          nullable: true
        city:
          type: string
        state:
          type: string
        postal_code:
          type: string
        country:
          type: string
        phone:
          type: string
          nullable: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: datetime
        updated_at:
          type: string
          format: datetime

    AddressCreate:
      type: object
      required:
        - type
        - first_name
        - last_name
        - address_line_1
        - city
        - state
        - postal_code
        - country
      properties:
        type:
          type: string
          enum: [home, work, other]
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        company:
          type: string
          maxLength: 100
          nullable: true
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
          nullable: true
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
          nullable: true
        is_default:
          type: boolean
          default: false

    AddressUpdate:
      type: object
      properties:
        type:
          type: string
          enum: [home, work, other]
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        company:
          type: string
          maxLength: 100
          nullable: true
        address_line_1:
          type: string
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
          nullable: true
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 20
          nullable: true
        is_default:
          type: boolean

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [credit_card, paypal, stripe]
        description:
          type: string
        enabled:
          type: boolean
        fee_percentage:
          type: number
          format: decimal
          nullable: true

    PaymentRequest:
      type: object
      required:
        - order_id
        - payment_method
      properties:
        order_id:
          type: integer
        payment_method:
          type: string
          enum: [credit_card, paypal, stripe]
        payment_details:
          type: object
          properties:
            card_number:
              type: string
              nullable: true
            card_holder:
              type: string
              nullable: true
            expiry_month:
              type: integer
              nullable: true
            expiry_year:
              type: integer
              nullable: true
            cvv:
              type: string
              nullable: true
            paypal_email:
              type: string
              nullable: true

    PaymentResponse:
      type: object
      properties:
        payment_id:
          type: string
        status:
          type: string
          enum: [success, failed, pending]
        transaction_id:
          type: string
        amount:
          type: number
          format: decimal
        currency:
          type: string
          default: USD
        message:
          type: string
        processed_at:
          type: string
          format: datetime

    PaymentDetails:
      type: object
      properties:
        payment_id:
          type: string
        transaction_id:
          type: string
