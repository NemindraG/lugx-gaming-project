# Istio Components Kustomization
# Aggregates all Istio service mesh configurations

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace for Istio components
namespace: lugx-dev

# Common labels
commonLabels:
  app.kubernetes.io/name: lugx-gaming
  app.kubernetes.io/component: service-mesh

# Resources
resources:
  - istio-namespace.yaml
  - gateway.yaml
  - destination-rules.yaml
  - security-policies.yaml