# Game Service Deployment with Migration Init Container
# Implements automatic database migrations before application startup

apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: lugx-gaming
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: game-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-service
        app.kubernetes.io/component: microservice
    spec:
      serviceAccountName: game-service-sa
      
      # Init container for database migrations
      initContainers:
      - name: migration
        image: game-service:latest
        imagePullPolicy: IfNotPresent
        command: ["alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://$(GAME_DB_USER):$(GAME_DB_PASSWORD)@$(GAME_DB_HOST):$(GAME_DB_PORT)/$(GAME_DB_NAME)"
        - name: GAME_DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-host
        - name: GAME_DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-port
        - name: GAME_DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-name
        - name: GAME_DB_USER
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-user
        - name: GAME_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-password
        - name: ENVIRONMENT
          value: "development"
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
      
      # Main application container
      containers:
      - name: game-service
        image: game-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://$(GAME_DB_USER):$(GAME_DB_PASSWORD)@$(GAME_DB_HOST):$(GAME_DB_PORT)/$(GAME_DB_NAME)"
        - name: GAME_DB_HOST
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-host
        - name: GAME_DB_PORT
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-port
        - name: GAME_DB_NAME
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-name
        - name: GAME_DB_USER
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-user
        - name: GAME_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: game-db-password
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: redis-host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: redis-port
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: redis-password
        - name: ENVIRONMENT
          value: "development"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10"]
      
      # Graceful shutdown
      terminationGracePeriodSeconds: 30
      
      # Host networking to access external databases
      hostNetwork: false
      dnsPolicy: ClusterFirst

---
# Game Service for Development
apiVersion: v1
kind: Service
metadata:
  name: game-service
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: microservice
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: game-service