  game-db-port: NTQzMg==
  game-db-name: bHVneF9nYW1lc19zdGFnaW5n  # lugx_games_staging
  game-db-user: Z2FtZV9zZXJ2aWNl
  game-db-password: Z2FtZV9zdGFnaW5nX3Bhc3N3b3JkXzIwMjQ=  # game_staging_password_2024
  
  order-db-host: bG9jYWxob3N0
  order-db-port: NTQzMw==
  order-db-name: bHVneF9vcmRlcnNfc3RhZ2luZw==  # lugx_orders_staging
  order-db-user: b3JkZXJfc2VydmljZQ==
  order-db-password: b3JkZXJfc3RhZ2luZ19wYXNzd29yZF8yMDI0  # order_staging_password_2024
  
