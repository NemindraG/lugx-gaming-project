# Database Secrets for Lugx Gaming Platform
# Contains all database connection credentials for services

apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: database-secrets
    app.kubernetes.io/component: configuration
type: Opaque
data:
  # Game Service Database Credentials
  game-db-host: bG9jYWxob3N0  # localhost (base64)
  game-db-port: NTQzMg==      # 5432 (base64)
  game-db-name: bHVneF9nYW1lcw==  # lugx_games (base64)
  game-db-user: Z2FtZV9zZXJ2aWNl  # game_service (base64)
  game-db-password: Z2FtZV9zZWN1cmVfcGFzc3dvcmRfMjAyNA==  # game_secure_password_2024 (base64)
  
  # Order Service Database Credentials  
  order-db-host: bG9jYWxob3N0  # localhost (base64)
  order-db-port: NTQzMw==      # 5433 (base64)
  order-db-name: bHVneF9vcmRlcnM=  # lugx_orders (base64)
  order-db-user: b3JkZXJfc2VydmljZQ==  # order_service (base64)
  order-db-password: b3JkZXJfc2VjdXJlX3Bhc3N3b3JkXzIwMjQ=  # order_secure_password_2024 (base64)
  
  # ClickHouse Analytics Database Credentials
  clickhouse-host: bG9jYWxob3N0  # localhost (base64)
  clickhouse-port: ODEyMw==      # 8123 (base64)
  clickhouse-db: bHVneF9hbmFseXRpY3M=  # lugx_analytics (base64)
  clickhouse-user: YW5hbHl0aWNzX3NlcnZpY2U=  # analytics_service (base64)
  clickhouse-password: YW5hbHl0aWNzX3NlY3VyZV9wYXNzd29yZF8yMDI0  # analytics_secure_password_2024 (base64)
  
  # Redis Cache Credentials
  redis-host: bG9jYWxob3N0  # localhost (base64)
  redis-port: NjM3OQ==      # 6379 (base64)
  redis-password: cmVkaXNfc2VjdXJlX3Bhc3N3b3JkXzIwMjQ=  # redis_secure_password_2024 (base64)

---
