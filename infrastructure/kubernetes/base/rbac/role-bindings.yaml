# ==============================================
# CLUSTER-WIDE BINDINGS (ALL ENVIRONMENTS)
# ==============================================

---
# Analytics Service can read from all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: analytics-service-binding-dev
subjects:
- kind: ServiceAccount
  name: analytics-service-sa
  namespace: lugx-dev
roleRef:
  kind: ClusterRole
  name: analytics-service-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: analytics-service-binding-staging
