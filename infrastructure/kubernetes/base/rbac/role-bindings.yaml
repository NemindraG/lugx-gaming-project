# Role Bindings for Lugx Gaming Platform
# Binds service accounts to their respective roles
# Bindings must be created in each namespace for proper isolation

# ==============================================
# DEVELOPMENT ENVIRONMENT (lugx-dev)
# ==============================================

---
# Bind Game Service account to its role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: game-service-binding
  namespace: lugx-dev
  labels:
    app.kubernetes.io/environment: development
subjects:
- kind: ServiceAccount
  name: game-service-sa
  namespace: lugx-dev
roleRef:
  kind: Role
  name: game-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Bind Order Service account to its role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: order-service-binding
  namespace: lugx-dev
  labels:
    app.kubernetes.io/environment: development
subjects:
- kind: ServiceAccount
  name: order-service-sa
  namespace: lugx-dev
roleRef:
  kind: Role
  name: order-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Bind Database admin account to its role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: database-admin-binding
  namespace: lugx-dev
  labels:
    app.kubernetes.io/environment: development
subjects:
- kind: ServiceAccount
  name: database-sa
  namespace: lugx-dev
roleRef:
  kind: Role
  name: database-admin-role
  apiGroup: rbac.authorization.k8s.io

