# Role-Based Access Control for Lugx Gaming Platform
# Defines what permissions each service has
# Roles are created for each namespace to ensure proper isolation

# ==============================================
# DEVELOPMENT ENVIRONMENT (lugx-dev)
# ==============================================

---
# Game Service Role - Can read config maps and secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: game-service-role
  namespace: lugx-dev
  labels:
    app.kubernetes.io/environment: development
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
# Order Service Role - Can read/write to persistent volumes
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: order-service-role
  namespace: lugx-dev
  labels:
    app.kubernetes.io/environment: development
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
# Database Admin Role - Full access to statefulsets and PVCs
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: database-admin-role
  namespace: lugx-dev
  labels:
    app.kubernetes.io/environment: development
rules:
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims", "persistentvolumes"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["*"]

