# Service Accounts for Lugx Gaming Platform
# Each service gets its own service account for security isolation
# Duplicated across all environments for proper isolation

# ==============================================
# DEVELOPMENT ENVIRONMENT (lugx-dev)
# ==============================================

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: game-service-sa
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: game-service
    app.kubernetes.io/component: service-account
    app.kubernetes.io/environment: development
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: service-account
    app.kubernetes.io/environment: development
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-service-sa
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: analytics-service
    app.kubernetes.io/component: service-account
    app.kubernetes.io/environment: development
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: service-account
    app.kubernetes.io/environment: development
automountServiceAccountToken: false  # Frontend doesn't need K8s API access

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-sa
  namespace: lugx-dev
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/component: service-account
    app.kubernetes.io/environment: development
automountServiceAccountToken: true

