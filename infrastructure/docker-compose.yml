version: '3.8'

services:
  # PostgreSQL for Game Service
  postgres-game:
    image: postgres:15-alpine
    container_name: game-service-db
    environment:
      POSTGRES_DB: lugx_games
      POSTGRES_USER: game_service
      POSTGRES_PASSWORD: game_secure_password_2024
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init/game-service.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres-game-data:/var/lib/postgresql/data
    networks:
      - lugx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_service -d lugx_games"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL for Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: lugx_orders
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: order_secure_password_2024
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/init/order-service.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - lugx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service -d lugx_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ClickHouse for Analytics Service
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: analytics-service-db
    environment:
      CLICKHOUSE_DB: lugx_analytics
      CLICKHOUSE_USER: analytics_service
      CLICKHOUSE_PASSWORD: analytics_secure_password_2024
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config/users.xml:/etc/clickhouse-server/users.xml:ro
      - ./clickhouse/config/config.xml:/etc/clickhouse-server/config.xml:ro
    networks:
      - lugx-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for Caching and Session Management
  redis:
    image: redis:7-alpine
    container_name: shared-redis-cache
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    networks:
      - lugx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Frontend Web Application
  frontend:
    image: nginx:alpine
    container_name: lugx-frontend
    ports:
      - "3000:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lugx-network
    depends_on:
      - postgres-game
      - postgres-order
      - clickhouse
      - redis
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for PostgreSQL Management (Development Only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lugx-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lugxgaming.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - lugx-network
    depends_on:
      - postgres-game
      - postgres-order
    restart: unless-stopped
    profiles:
      - development

volumes:
  postgres-game-data:
    driver: local
  postgres-order-data:
    driver: local
  clickhouse-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  lugx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16