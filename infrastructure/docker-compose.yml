services:
  # PostgreSQL for Game Service
  postgres-game:
    image: postgres:15-alpine
    container_name: game-service-db
    environment:
      POSTGRES_DB: lugx_games
      POSTGRES_USER: game_service
      POSTGRES_PASSWORD: game_secure_password_2024
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - ./infrastructure/docker/postgres/init/game-service.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres-game-data:/var/lib/postgresql/data
    networks:
      - lugx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_service -d lugx_games"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL for Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: order-service-db
    environment:
      POSTGRES_DB: lugx_orders
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: order_secure_password_2024
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - ./infrastructure/docker/postgres/init/order-service.sql:/docker-entrypoint-initdb.d/01-init.sql
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - lugx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service -d lugx_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ClickHouse for Analytics Service
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: analytics-service-db
    environment:
      CLICKHOUSE_DB: lugx_analytics
      CLICKHOUSE_USER: analytics_user
      CLICKHOUSE_PASSWORD: analytics_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native protocol
    volumes:
      - ./infrastructure/docker/clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - lugx-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for Caching and Session Management
  redis:
    image: redis:7-alpine
    container_name: shared-redis-cache
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - lugx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Game Service (FastAPI)
  game-service:
    build:
      context: ../services/game-service
      dockerfile: Dockerfile
    container_name: lugx-game-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://game_service:game_secure_password_2024@postgres-game:5432/lugx_games
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    ports:
      - "8001:8001"
    networks:
      - lugx-network
    depends_on:
      postgres-game:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Order Service (FastAPI)
  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    container_name: lugx-order-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://order_service:order_secure_password_2024@postgres-order:5432/lugx_orders
      - REDIS_URL=redis://redis:6379/1
      - GAME_SERVICE_URL=http://game-service:8001
      - ENVIRONMENT=development
      - JWT_SECRET_KEY=your-secret-key-here-change-in-production
    ports:
      - "8002:8002"
    networks:
      - lugx-network
    depends_on:
      postgres-order:
        condition: service_healthy
      redis:
        condition: service_healthy
      game-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Analytics Service (FastAPI)
  analytics-service:
    build:
      context: ../services/analytics-service
      dockerfile: Dockerfile
    container_name: lugx-analytics-service
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=lugx_analytics
      - CLICKHOUSE_USERNAME=analytics_user
      - CLICKHOUSE_PASSWORD=analytics_password
      - ENVIRONMENT=development
    ports:
      - "8003:8003"
    networks:
      - lugx-network
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Frontend Web Application
  frontend:
    image: nginx:alpine
    container_name: lugx-frontend
    ports:
      - "3000:80"
    volumes:
      - ../lugx_gaming:/usr/share/nginx/html:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - lugx-network
    depends_on:
      game-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin for PostgreSQL Management (Development Only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lugx-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lugxgaming.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_2024
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - lugx-network
    depends_on:
      - postgres-game
      - postgres-order
    restart: unless-stopped
    profiles:
      - development

volumes:
  postgres-game-data:
    driver: local
  postgres-order-data:
    driver: local
  clickhouse-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  lugx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
